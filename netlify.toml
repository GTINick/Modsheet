[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Builds moved back to "coming soon" send visitors to the build list instead of a 404.
[[redirects]]
  from = "/builds/e30-325i/*"
  to = "/#builds"
  status = 302

# The shop is off until new shirts are ready; old shop links go home instead of a 404.
[[redirects]]
  from = "/shop/*"
  to = "/"
  status = 302
